name: PlatformIO build and release artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Validate release metadata and source checks
        run: python tools/release_check.py
      - name: Build StickS3 firmware
        run: pio run -e m5stack-sticks3
      - name: Firmware and RAM size report
        run: pio run -e m5stack-sticks3 -t size
      - name: Package source and compiled binaries
        run: |
          python tools/package_release.py --source
          python tools/package_release.py --firmware
      - name: Upload versioned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sound-chomp-build-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
